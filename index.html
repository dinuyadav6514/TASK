<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Unix-style terminal task manager with directory tree structure, live analytics, and local persistence.">
<meta name="theme-color" content="#0c0e0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Task Terminal</title>

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c0e0c'/%3E%3Cpath d='M6 10l6 6-6 6M15 22h10' stroke='%234ade80' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="tasks.css">
<script>
// Live Server Guard: Prevent automatic page reload when tasks_data.json is saved to disk
(function() {
  window.__lastDiskSaveTime = 0;
  window.notifyDiskSaved = function() {
    window.__lastDiskSaveTime = Date.now();
    try {
      if (window.parent && window.parent !== window) {
        if (typeof window.parent.notifyDiskSaved === "function") {
          window.parent.notifyDiskSaved();
        }
        window.parent.postMessage({ type: "tasks_disk_saved", time: Date.now() }, "*");
      }
    } catch (e) {}
  };

  const OrigWS = window.WebSocket;
  if (!OrigWS) return;

  const origOnMessageDesc = Object.getOwnPropertyDescriptor(OrigWS.prototype, "onmessage");
  if (origOnMessageDesc && origOnMessageDesc.set) {
    Object.defineProperty(OrigWS.prototype, "onmessage", {
      get: origOnMessageDesc.get,
      set: function(handler) {
        const ws = this;
        const guarded = function(event) {
          if (event && event.data === "reload") {
            const elapsed = Date.now() - (window.__lastDiskSaveTime || 0);
            if (elapsed < 5000) {
              console.info(`[Live Server Guard] Suppressed auto-reload from disk save (${elapsed}ms ago).`);
              return;
            }
          }
          if (typeof handler === "function") {
            handler.call(ws, event);
          }
        };
        origOnMessageDesc.set.call(ws, guarded);
      },
      configurable: true,
      enumerable: true
    });
  }

  const origAddEventListener = OrigWS.prototype.addEventListener;
  OrigWS.prototype.addEventListener = function(type, listener, options) {
    if (type === "message" && typeof listener === "function") {
      const ws = this;
      const guarded = function(event) {
        if (event && event.data === "reload") {
          const elapsed = Date.now() - (window.__lastDiskSaveTime || 0);
          if (elapsed < 5000) {
            console.info(`[Live Server Guard] Suppressed auto-reload from disk save (${elapsed}ms ago).`);
            return;
          }
        }
        return listener.call(ws, event);
      };
      return origAddEventListener.call(this, type, guarded, options);
    }
    return origAddEventListener.call(this, type, listener, options);
  };
})();
</script>
</head>
<body>

<div id="crt-overlay"></div>

<div class="terminal-shell" id="terminal-shell">
  <div class="terminal-titlebar">
    <span class="tb-dot red"></span>
    <span class="tb-dot yellow"></span>
    <span class="tb-dot green"></span>
    <span class="tb-title" id="terminal-title">task-terminal — zsh</span>
    <span class="tb-status" id="save-status" role="button" tabindex="0" title="Click to link tasks_data.json on disk">●&nbsp;no file linked</span>
  </div>

  <div class="terminal-screen" id="terminal-screen">
    <div class="terminal-output" id="terminal-output"></div>

    <div class="terminal-input-line" id="input-line">
      <span class="prompt-user">guest@tasks</span><span class="prompt-sep">:</span><span class="prompt-path" id="prompt-path">~</span><span class="prompt-dollar">$</span>
      <span class="input-wrap">
        <span id="typed-text" class="typed-text"></span><span class="cursor" id="cursor">█</span>
        <input type="text" id="hidden-input" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text" aria-label="Terminal command input" />
      </span>
    </div>
  </div>
</div>

<!-- Hidden file input for import / upload command -->
<input type="file" id="import-file-input" accept=".json" style="display:none;" />

<script src="tasks.js"></script>
</body>
</html>
